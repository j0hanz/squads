[tool.ruff]
# Minimum interpreter the shipped scripts must run on, not just a lint dialect:
# hooks/perf-hook.py and skills/**/scripts/*.py are invoked with whatever
# python/python3/py is on the user's PATH. Keep this at the real floor so
# `ruff check .` rejects syntax that floor cannot parse.
target-version = "py311"
line-length = 79

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",
    "I",
    "B",
    "UP",
    "C4",
    "SIM",
    "FLY",
    "PIE",
    "RET",
    "PERF",
    "FURB",
    "ASYNC",
    "LOG",
    "RUF",
    "ERA",
    "PGH",
]
ignore = []

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["skills/brainstorm/scripts/tests"]

[dependency-groups]
dev = [
    "ruff>=0.12",
    "pytest>=8",
]